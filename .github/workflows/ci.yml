name: ci

# Policy: develop locally; remote CI on PRs + main (not every feature push).
# Docs: docs/engineering/GITHUB_ACTIONS_OPTIMIZATION.md

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Keep job id/name "build-test" — may be referenced by required status checks.
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Official engines: Node >=20. Keep 20+22 for compatibility evidence.
        # Primary savings come from trigger/concurrency/paths-ignore, not dropping 22.
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: node scripts/sync-workspace-lock.mjs
      - run: npm install --no-audit --no-fund
      # Package exports point at dist/; build before typecheck/tests.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test
      - run: npm run publish:check
      - run: npm run examples:smoke
